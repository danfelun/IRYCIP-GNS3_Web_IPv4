<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROYECTO ORIGEN | Laboratorio TCP/IP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #071b33;
      color: #f5f7fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .contenedor {
      width: 420px;
      padding: 40px;
      background: #0d2745;
      border: 1px solid #00a99a;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 169, 154, 0.25);
    }
    .marca { text-align: center; margin-bottom: 30px; }
    .marca h1 { margin: 0; color: #4da8ff; font-size: 30px; }
    .marca span { color: #00a99a; }
    .marca p { color: #b8c6d9; margin-top: 8px; }
    label { display: block; margin-bottom: 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 22px;
      border: 1px solid #355978;
      border-radius: 7px;
      background: #081a2d;
      color: white;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #00a99a; }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #00a99a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #008c80; }
    .nota {
      margin-top: 25px;
      padding: 12px;
      border-left: 4px solid #fab400;
      background: #102d4c;
      font-size: 13px;
      color: #cbd7e5;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="marca">
      <h1>PROYECTO <span>ORIGEN</span></h1>
      <p>Laboratorio de comunicaciones TCP/IP</p>
    </div>

    <form action="/" method="GET">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>

      <button type="submit">Iniciar sesión</button>
    </form>

    <div class="nota">
      Laboratorio académico. Observe mediante Wireshark cómo se transporta la información utilizando HTTP.
    </div>
  </div>
</body>
</html>
